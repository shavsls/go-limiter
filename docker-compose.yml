name: go-limiter-project

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - APP_VERSION=${APP_VERSION:-dev}
    container_name: go-limiter-app
    image: go-limiter-app:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - REDIS_ADDR=redis:6379
      - PORT=8080
      - RATE_LIMIT=${RATE_LIMIT:-5}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-30s}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: go-limiter-test
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - test

  redis:
    image: redis:alpine
    container_name: go-limiter-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
